# ==============================================================================
# SonarCloud Configuration — APEX VISION IVI
# ==============================================================================

sonar.projectKey=skrehanahamed_Apex_Vision_IVI
sonar.organization=skrehanahamed

# Primary source code directories for C++ and QML analysis
sonar.sources=backend,main.cpp,qml

# Exclude generated files, heavy media, binary assets, and web bundles
sonar.exclusions=web/**,assets/**,build*/**,**/*.rcc,**/*.png,**/*.jpg,**/*.svg,**/*.wav,**/*.mp3,**/*.mp4,**/*.mesh

# Source code encoding
sonar.sourceEncoding=UTF-8

# Provide CMake compilation database for accurate C++ analysis
sonar.cfamily.compile-commands=build/compile_commands.json
