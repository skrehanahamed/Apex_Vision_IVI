<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <circle cx="40" cy="40" r="39" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="navBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="navRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
    <filter id="navShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Automotive GPS Compass / Navigation Pointer -->
  <g filter="url(#navShadow)">
    <!-- Top Pointer (North) -->
    <polygon points="40,16 52,40 40,36" fill="url(#navRed)"/>
    <polygon points="40,16 28,40 40,36" fill="#B71C1C"/>
    <!-- Bottom Pointer (South) -->
    <polygon points="40,64 52,40 40,36" fill="url(#navBlue)"/>
    <polygon points="40,64 28,40 40,36" fill="#0A387E"/>
    <!-- Center Bezel Pivot -->
    <circle cx="40" cy="36" r="3" fill="#FFFFFF"/>
  </g>
</svg>
