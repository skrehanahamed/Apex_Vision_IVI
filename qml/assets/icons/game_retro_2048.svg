<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg2048" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="tile4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="tile8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tileHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg2048)" stroke="#8B5CF6" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Matrix Grid Border -->
  <rect x="22" y="22" width="84" height="84" rx="14" fill="#0A0F1D" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Pixel / Neon Tiles (4x4 Grid) -->
  <!-- Row 1 -->
  <rect x="28" y="28" width="16" height="16" rx="4" fill="url(#tile2)" stroke="#00F0FF" stroke-width="0.8"/>
  <text x="36" y="39" font-family="monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <rect x="48" y="28" width="16" height="16" rx="4" fill="url(#tile4)" stroke="#34D399" stroke-width="0.8"/>
  <text x="56" y="39" font-family="monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <rect x="68" y="28" width="16" height="16" rx="4" fill="url(#tile8)" stroke="#FBBF24" stroke-width="0.8"/>
  <text x="76" y="39" font-family="monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>

  <rect x="88" y="28" width="16" height="16" rx="4" fill="#1E293B"/>

  <!-- Row 2 -->
  <rect x="28" y="48" width="16" height="16" rx="4" fill="#1E293B"/>

  <rect x="48" y="48" width="16" height="16" rx="4" fill="url(#tile2)" stroke="#00F0FF" stroke-width="0.8"/>
  <text x="56" y="59" font-family="monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <rect x="68" y="48" width="16" height="16" rx="4" fill="#1E293B"/>

  <rect x="88" y="48" width="16" height="16" rx="4" fill="url(#tile4)" stroke="#34D399" stroke-width="0.8"/>
  <text x="96" y="59" font-family="monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- Row 3 & 4: Hero 2048 Mega Tile -->
  <rect x="28" y="68" width="36" height="32" rx="6" fill="url(#tileHero)" stroke="#F472B6" stroke-width="1.5"/>
  <text x="46" y="85" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2048</text>
  <text x="46" y="94" font-family="monospace" font-size="6" fill="#FDE047" text-anchor="middle">★ HYPER ★</text>

  <rect x="68" y="68" width="16" height="16" rx="4" fill="url(#tile8)" stroke="#FBBF24" stroke-width="0.8"/>
  <text x="76" y="79" font-family="monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>

  <rect x="88" y="68" width="16" height="16" rx="4" fill="url(#tile2)" stroke="#00F0FF" stroke-width="0.8"/>
  <text x="96" y="79" font-family="monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <rect x="68" y="88" width="16" height="12" rx="3" fill="#1E293B"/>
  <rect x="88" y="88" width="16" height="12" rx="3" fill="url(#tile4)" stroke="#34D399" stroke-width="0.8"/>

  <!-- Neon Pixel Sparks -->
  <rect x="14" y="16" width="3" height="3" fill="#8B5CF6"/>
  <rect x="110" y="20" width="3" height="3" fill="#00D2FF"/>
  <rect x="108" y="104" width="3" height="3" fill="#F472B6"/>
  <rect x="16" y="108" width="3" height="3" fill="#34D399"/>
</svg>
