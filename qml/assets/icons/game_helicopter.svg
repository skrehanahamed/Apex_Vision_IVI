<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="heliBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1118"/>
      <stop offset="50%" stop-color="#142838"/>
      <stop offset="100%" stop-color="#070B10"/>
    </linearGradient>
    <linearGradient id="canyonSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5E36"/>
      <stop offset="50%" stop-color="#FFAE33"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>
    <linearGradient id="heliBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#006699"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#heliBg)" stroke="#00D2FF" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Desert Canyon Sunset -->
  <circle cx="64" cy="50" r="28" fill="url(#canyonSun)" opacity="0.85"/>
  <rect x="36" y="46" width="56" height="2" fill="#142838"/>
  <rect x="38" y="52" width="52" height="2.5" fill="#142838"/>
  <rect x="44" y="58" width="40" height="3" fill="#142838"/>

  <!-- Canyon Mountain Silhouettes -->
  <polygon points="10,118 36,78 58,94 82,72 108,98 118,118" fill="#181312" opacity="0.9"/>
  <polygon points="24,118 52,86 78,104 104,80 118,118" fill="#2E1C16" opacity="0.7"/>

  <!-- Rotor Blur Glow Arc -->
  <ellipse cx="60" cy="38" rx="42" ry="3.5" fill="#00E5FF" opacity="0.45" filter="url(#glow)"/>
  <line x1="18" y1="38" x2="102" y2="38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Rotor Mast -->
  <rect x="58" y="38" width="4" height="8" fill="#CBD5E1"/>

  <!-- Helicopter Fuselage (Futuristic Military Silhouette) -->
  <path d="M 38 52 
           C 42 46, 76 46, 84 52 
           C 88 55, 88 64, 82 67 
           C 74 71, 46 72, 38 67 
           C 34 64, 34 56, 38 52 Z" 
        fill="url(#heliBody)" stroke="#00F0FF" stroke-width="1.5"/>

  <!-- Cockpit Glass Canopy -->
  <path d="M 66 49 C 74 49, 83 52, 83 58 C 80 62, 70 62, 66 61 Z" fill="#E0F7FA" opacity="0.85"/>

  <!-- Tail Boom & Stabilizer -->
  <path d="M 40 56 L 16 57 L 14 51 L 20 51 L 24 55 Z" fill="#006699" stroke="#00F0FF" stroke-width="1"/>
  <!-- Tail Rotor -->
  <ellipse cx="14" cy="51" rx="2" ry="8" fill="#00E5FF" opacity="0.6"/>

  <!-- Landing Skids -->
  <line x1="42" y1="73" x2="78" y2="73" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="68" x2="46" y2="73" stroke="#94A3B8" stroke-width="2"/>
  <line x1="72" y1="68" x2="70" y2="73" stroke="#94A3B8" stroke-width="2"/>

  <!-- Missile Pod & Glow Flare -->
  <rect x="52" y="65" width="16" height="4" rx="1.5" fill="#EF4444"/>
  <circle cx="70" cy="67" r="2.5" fill="#FFDD00" filter="url(#glow)"/>

  <!-- HUD Crosshairs / Stars -->
  <line x1="102" y1="26" x2="110" y2="26" stroke="#00D2FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="106" y1="22" x2="106" y2="30" stroke="#00D2FF" stroke-width="1.5" opacity="0.6"/>
  <circle cx="22" cy="24" r="1.5" fill="#00D2FF" opacity="0.7"/>
</svg>
